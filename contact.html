    <div class="ambient-shape ambient-shape--one" aria-hidden="true"></div>
    <div class="ambient-shape ambient-shape--two" aria-hidden="true"></div>

    <div data-shared-header></div>

    <main class="page-wrap">
      <nav class="crumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a> / <span>Contact Us</span>
      </nav>

      <section class="page-hero" data-reveal>
        <h1>Contact Us</h1>
        <p>Have a question, idea, or feedback? Send a message and we will get back to you.</p>
      </section>

      <section class="section" data-reveal>
        <article class="text-card contact-card">
          <h2>Get in Touch</h2>
          <p class="contact-card__intro">
            We read every message. Share what you are working on or what you would like to see next.
          </p>
          <p class="contact-card__email">
            <span>Email:</span>
            <a href="mailto:moonlithome27@gmail.com">moonlithome27@gmail.com</a>
          </p>

          <form
            class="contact-form"
            action="mailto:moonlithome27@gmail.com"
            method="post"
            enctype="text/plain"
          >
            <label for="contact-name">Name</label>
            <input id="contact-name" name="name" type="text" autocomplete="name" required />

            <label for="contact-email">Email</label>
            <input id="contact-email" name="email" type="email" autocomplete="email" required />

            <label for="contact-message">Message</label>
            <textarea id="contact-message" name="message" rows="5" required></textarea>

            <button class="btn btn--primary" type="submit">Submit</button>
          </form>
        </article>
      </section>
    </main>

    <div data-shared-footer></div>
